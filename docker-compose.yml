services:
  db:
    image: postgres:15
    container_name: qa-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # SEGURANÇA: Em produção, NÃO exponha a porta do banco para o host.
    # Defina DB_PORT_EXPOSED apenas em desenvolvimento local.
    # Para produção, remova o bloco "ports" abaixo inteiramente.
    ports:
      - "${DB_PORT_EXPOSED:-}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-test:
    image: postgres:15
    container_name: qa-db-test
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_TEST:-qa_control_test}
    ports:
      - "${DB_TEST_PORT_EXPOSED:-5434}:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_TEST:-qa_control_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: qa-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      REGISTER_TOKEN: ${REGISTER_TOKEN}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    # HEALTHCHECK definido no Dockerfile (GET /health) é herdado automaticamente

  frontend:
    build:
      context: ./frontend
      # Modo desenvolvimento (hot reload) — para build de produção via Nginx,
      # use docker-compose.prod.yml (target: production).
      target: dev
    container_name: qa-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  pgdata:
  pgdata-test:
