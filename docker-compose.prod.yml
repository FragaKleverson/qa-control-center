# Docker Compose — Produção (Fase 4, item 15)
#
# Diferenças em relação ao docker-compose.yml (desenvolvimento):
#   - Porta do banco NÃO é exposta ao host (apenas a rede interna do compose)
#   - Frontend usa o target "production" do Dockerfile (build estático servido via Nginx, porta 80)
#   - Sem o serviço db-test (banco de testes não faz sentido em produção)
#   - restart: unless-stopped (permite parar deliberadamente sem restart automático)
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Antes de subir pela primeira vez, aplique as migrations do banco:
#   npm run db:migrate   (executado a partir de uma máquina/CI com devDependencies instaladas)

services:
  db:
    image: postgres:15
    container_name: qa-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: production
    image: qa-control-center-backend:prod
    container_name: qa-backend-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      REGISTER_TOKEN: ${REGISTER_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    # HEALTHCHECK definido no Dockerfile (GET /health) é herdado automaticamente

  frontend:
    build:
      context: ./frontend
      target: production
    image: qa-control-center-frontend:prod
    container_name: qa-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # HEALTHCHECK definido no Dockerfile (GET /) é herdado automaticamente

volumes:
  pgdata-prod:
